<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a2e23">
<meta name="description" content="مكتبة الطالب الإسلامية — قرآن، تفسير، توحيد، سيرة، أدلة وجود الله، واختبارات">
<title>مكتبة الطالب الإسلامية</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-ornament" aria-hidden="true"></div>

<header class="app-header">
  <div class="header-inner">
    <div class="logo">
      <svg viewBox="0 0 48 48" class="logo-icon"><path d="M24 4c-4 4-9 6-14 6v26c5 0 10-2 14-6 4 4 9 6 14 6V10c-5 0-10-2-14-6z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M24 4v26" stroke="currentColor" stroke-width="2.5"/><path d="M15 8c3 1 6 1 9 3M15 14c3 1 6 1 9 3" stroke="currentColor" stroke-width="1.6" opacity=".7"/></svg>
      <div>
        <h1>مكتبة الطالب</h1>
        <p>الإسلامية لطلب العلم</p>
      </div>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="تبديل المظهر">☾</button>
  </div>
</header>

<main id="app" class="app-main"></main>

<nav class="tabbar" aria-label="التنقل الرئيسي">
  <button class="tab active" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>الرئيسية</span>
  </button>
  <button class="tab" data-tab="quran">
    <svg viewBox="0 0 24 24"><path d="M12 3c-2.5 2.5-6 4-9.5 4v13c3.5 0 7-1.5 9.5-4 2.5 2.5 6 4 9.5 4V7c-3.5 0-7-1.5-9.5-4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v13" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>القرآن</span>
  </button>
  <button class="tab" data-tab="library">
    <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 19a2 2 0 0 1 2-2h13" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>المكتبة</span>
  </button>
  <button class="tab" data-tab="tajweed">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>التجويد</span>
  </button>
  <button class="tab" data-tab="quiz">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>الاختبار</span>
  </button>
</nav>

<div id="toast" class="toast" role="status"></div>

<script src="js/data-suwar.js"></script>
<script src="js/data-gulf.js"></script>
<script src="js/data-books.js"></script>
<script src="js/data-quiz.js"></script>
<script src="js/app.js"></script>
<script src="js/quran.js"></script>
<script src="js/quran-mushaf.js"></script>
<script src="js/quran-tadabbur.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
